<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:'EB Garamond', Georgia, serif;
}

/* Exact iPhone 15 wallpaper canvas */
.canvas{
width:1179px;
height:2556px;
background:#000;

display:flex;
align-items:center;
justify-content:center;
padding:200px;

text-align:center;
}

/* Text block */

.block{
max-width:850px;
display:flex;
flex-direction:column;
gap:40px;
}

.term{
font-style:italic;
font-size:120px;
line-height:1.2;
color:#e8c97e;
}

.def{
font-size:54px;
line-height:1.6;
color:#b0a8d0;
}

</style>
</head>

<body>

<div class="canvas">
<div class="block">
<div class="term" id="term"></div>
<div class="def" id="def"></div>
</div>
</div>

<script>

let entries=[];

function updateWord(){

if(!entries.length) return;

/* change every 10 minutes */
const slot=Math.floor(Date.now()/600000);
const index=slot%entries.length;

document.getElementById("term").textContent=entries[index].term;
document.getElementById("def").textContent=entries[index].def;

}

fetch("./words.json")
.then(r=>r.json())
.then(data=>{
entries=data;
updateWord();
})
.catch(()=>{
document.getElementById("term").textContent="words.json";
document.getElementById("def").textContent="File not found";
});

</script>

</body>
</html>
