<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Wallpaper</title>
<style>
  * { margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; background:#0d0d1a; }
  canvas { display:block; width:390px; height:844px; }
</style>
</head>
<body>
<canvas id="c" width="1170" height="2532"></canvas>
<script>
function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function draw(entry) {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cX = W / 2;
  const pad = 110;
  const maxW = W - pad * 2;

  // ── Background ──
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0,   '#0a0a14');
  gr.addColorStop(0.5, '#110e20');
  gr.addColorStop(1,   '#0d0a18');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, W, H);

  // ── Measure everything first so we can center the block ──
  const termFont   = `300 italic 96px 'Georgia',serif`;
  const defFont    = `300 40px 'Georgia',serif`;
  const termLH     = 116;
  const defLH      = 62;
  const gap        = 60; // space between term block and def block

  ctx.font = termFont;
  const termLines = wrapText(ctx, entry.term, maxW);

  ctx.font = defFont;
  const defLines = (() => {
    let lines = wrapText(ctx, entry.def, maxW);
    if (lines.length > 8) {
      lines = lines.slice(0, 8);
      lines[7] = lines[7].replace(/\s+\S+$/, '') + '…';
    }
    return lines;
  })();

  const termBlockH = termLines.length * termLH;
  const defBlockH  = defLines.length * defLH;
  const totalH     = termBlockH + gap + defBlockH;

  // Vertically center the whole block
  const blockTop = (H - totalH) / 2;

  // ── Term ──
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  termLines.forEach((line, i) => {
    ctx.font = termFont;
    ctx.fillStyle = '#e8c97e';
    ctx.fillText(line, cX, blockTop + i * termLH);
  });

  // ── Definition ──
  const defTop = blockTop + termBlockH + gap;
  defLines.forEach((line, i) => {
    ctx.font = defFont;
    ctx.fillStyle = '#b0a8d0';
    ctx.fillText(line, cX, defTop + i * defLH);
  });
}

fetch('./words.json')
  .then(r => r.json())
  .then(entries => {
    if (!entries || !entries.length) throw new Error('empty');
    draw(entries[new Date().getHours() % entries.length]);
  })
  .catch(() => {
    draw({ term: 'words.json', def: 'File not found in repo root.' });
  });
</script>
</body>
</html>
