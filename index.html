<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Wallpaper</title>
<style>
  * { margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; background:transparent; }
  canvas { display:block; width:390px; height:844px; background:transparent; }
</style>
</head>
<body>
<canvas id="c" width="1170" height="2532"></canvas>
<script>
// ── URL params ──────────────────────────────────────────────
// ?offset=150   → left margin in CSS pixels (multiplied ×3 for canvas)
// ?width=300    → content width in CSS pixels (multiplied ×3 for canvas)
// Example: wallpaper.html?offset=150&width=240
const params  = new URLSearchParams(location.search);
const SCALE   = 3; // canvas is 3× the CSS viewport
const offsetPx = (parseFloat(params.get('offset') || '0'))  * SCALE;
const widthPx  = (parseFloat(params.get('width')  || '390')) * SCALE;

function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function draw(entry) {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Content column
  const colLeft  = offsetPx;
  const colWidth = Math.min(widthPx, W - offsetPx);
  const colCX    = colLeft + colWidth / 2;   // horizontal center of content area
  const pad      = 40 * SCALE;               // inner padding within column
  const maxW     = colWidth - pad * 2;

  // ── Layout ──
  const termFont = `italic 96px 'Georgia',serif`;
  const defFont  = `40px 'Georgia',serif`;
  const termLH   = 130;
  const defLH    = 66;
  const gap      = 80;

  ctx.font = termFont;
  const termLines = wrapText(ctx, entry.term, maxW);

  ctx.font = defFont;
  let defLines = wrapText(ctx, entry.def, maxW);
  if (defLines.length > 8) {
    defLines = defLines.slice(0, 8);
    defLines[7] = defLines[7].replace(/\s+\S+$/, '') + '…';
  }

  const totalH   = termLines.length * termLH + gap + defLines.length * defLH;
  const blockTop = (H - totalH) / 2;

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  // ── Term ──
  termLines.forEach((line, i) => {
    ctx.font      = termFont;
    ctx.fillStyle = '#e8c97e';
    ctx.fillText(line, colCX, blockTop + i * termLH + termLH / 2);
  });

  // ── Definition ──
  const defTop = blockTop + termLines.length * termLH + gap;
  defLines.forEach((line, i) => {
    ctx.font      = defFont;
    ctx.fillStyle = '#b0a8d0';
    ctx.fillText(line, colCX, defTop + i * defLH + defLH / 2);
  });
}

fetch('./words.json')
  .then(r => r.json())
  .then(entries => {
    if (!entries || !entries.length) throw new Error('empty');
    draw(entries[new Date().getHours() % entries.length]);
  })
  .catch(() => draw({ term: 'words.json', def: 'File not found in repo root.' }));
</script>
</body>
</html>
