<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}

/* iPhone 15 wallpaper canvas */
.canvas{
width:1179px;
height:2556px;
background:#000;

display:flex;
align-items:center;
justify-content:center;
text-align:center;

padding:240px 160px;
}

.block{
max-width:820px;
display:flex;
flex-direction:column;
gap:60px;
}

.word{
font-size:120px;
font-weight:600;
letter-spacing:6px;
color:#ffffff;
}

.def{
font-size:52px;
line-height:1.5;
color:#9a9a9a;
font-weight:400;
}

</style>
</head>

<body>

<div class="canvas">
<div class="block">
<div class="word" id="word"></div>
<div class="def" id="def"></div>
</div>
</div>

<script>

let entries=[];

function updateWord(){

if(!entries.length) return;

const slot=Math.floor(Date.now()/600000);
const index=slot % entries.length;

const entry=entries[index];

document.getElementById("word").textContent = `[ ${entry.term.toUpperCase()} ]`;
document.getElementById("def").textContent  = entry.def;

}

fetch("./words.json")
.then(r=>r.json())
.then(data=>{
entries=data;
updateWord();
})
.catch(()=>{
document.getElementById("word").textContent="[ WORD ]";
document.getElementById("def").textContent="words.json missing";
});

</script>

</body>
</html>
