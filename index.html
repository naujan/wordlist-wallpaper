<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 844px;
    overflow: hidden;
    background: #000;
  }

  .page {
    width: 390px;
    height: 844px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--offset, 0px);
  }

  .block {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    text-align: center;
  }

  .term {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 42px;
    line-height: 1.25;
    color: #e8c97e;
    word-break: break-word;
  }

  .def {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: normal;
    font-size: 18px;
    line-height: 1.7;
    color: #b0a8d0;
    word-break: break-word;
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="block">
    <div class="term" id="term"></div>
    <div class="def" id="def"></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const offset = params.get('offset') || '0';
  document.getElementById('page').style.padding = `0 0 0 ${offset}px`;

  fetch('./words.json')
    .then(r => r.json())
    .then(entries => {
      if (!entries || !entries.length) throw new Error('empty');
      const entry = entries[new Date().getHours() % entries.length];
      document.getElementById('term').textContent = entry.term;
      document.getElementById('def').textContent  = entry.def;
    })
    .catch(() => {
      document.getElementById('term').textContent = 'words.json';
      document.getElementById('def').textContent  = 'File not found in repo root.';
    });
</script>
</body>
</html>
